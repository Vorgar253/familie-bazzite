name: familie-bazzite
description: Bazzite GNOME (Nvidia Legacy) für die Familienrechner
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: stable

modules:
  # Kopiert alles aus files/system/ ins Image (hier: GNOME-Standardeinstellungen)
  - type: files
    files:
      - source: system
        destination: /

  # Übernimmt die dconf-Einstellungen beim Systemstart
  - type: bling
    install:
      - dconf-update-service

  # Macht eigene ujust-Befehle aus files/justfiles/ verfügbar
  - type: justfiles

  - type: default-flatpaks
    configurations:
      # Programme für alle Benutzer
      - scope: system
        install:
          - com.bitwarden.desktop
          - com.brave.Browser
          - com.github.Matoking.protontricks
          - com.github.jeromerobert.pdfarranger
          - com.github.tchx84.Flatseal
          - com.heroicgameslauncher.hgl
          - com.mattjakeman.ExtensionManager
          - com.orcaslicer.OrcaSlicer
          - com.ranfdev.DistroShelf
          - com.teamspeak.TeamSpeak
          - com.vysp3r.ProtonPlus
          - eu.nokun.MirrorHall
          - io.github.flattool.Warehouse
          - io.mgba.mGBA
          - io.missioncenter.MissionCenter
          - md.obsidian.Obsidian
          - one.ablaze.floorp
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.Firmware
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.NautilusPreviewer
          - org.gnome.Showtime
          - org.gnome.TextEditor
          - org.gnome.baobab
          - org.gnome.clocks
          - org.gnome.font-viewer
          - org.jellyfin.JellyfinDesktop
          - org.signal.Signal
          - org.torproject.torbrowser-launcher
          - org.vinegarhq.Sober
          - page.tesk.Refine
          - xyz.xclicker.xclicker

      # Flathub zusätzlich pro Benutzer (Laufzeit für SolidCraft)
      - scope: user
        notify: false
        repo:
          title: Flathub (user)

      # SolidCraft aus der Herstellerquelle, pro Benutzer
      - scope: user
        repo:
          url: https://docs.solidcraft.io/flatpak/solidcraft.flatpakrepo
          name: solidcraft
          title: SolidCraft
        install:
          - ai.storyteller.solidcraft

  - type: signing
